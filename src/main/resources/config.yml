#
#   Плагин бесплатный и с открытым исходным кодом. Если он тебе пригодился —
#   загляни в Telegram: там выходят новые плагины линейки SN, а ещё там можно
#   заказать плагин или 3D-модель под свой проект.
#
#                              ▸  t.me/somikyy  ◂
#
# ─────────────────────────────────────────────────────────────────────────────
#  НАСТРОЙКА ЗА ПЯТЬ МИНУТ
# ─────────────────────────────────────────────────────────────────────────────
#  1. Напиши @BotFather команду /newbot и получи токен. Впиши его ниже.
#  2. Создай группу в Telegram и добавь туда бота как АДМИНИСТРАТОРА.
#     Без прав администратора бот не увидит сообщения обычных участников.
#  3. Узнай id группы: добавь в неё @getmyid_bot и посмотри его ответ.
#     У группы id отрицательный, например -1001234567890123.
#  4. Впиши токен и id ниже, затем /sntelegram reload.
#
#  Хочешь разделить чат, админку и логи? Включи в группе «Темы» (Topics),
#  создай темы и впиши их номера в раздел topics ниже. Номер темы виден в
#  ссылке на неё: t.me/c/1234567890/47 → thread-id: 47.
#
#  ВАЖНО про тему «General»: у неё нет номера. Для неё пиши thread-id: 0.
#  Значение 1, которое советуют в интернете, Telegram отклоняет ошибкой.
# ─────────────────────────────────────────────────────────────────────────────

# Не трогать. Используется для миграции конфигов между версиями.
config-version: 1

general:

  # Язык сообщений плагина. Сейчас поддержан только ru.
  language: ru

  # Показывать ли имена авторов из Telegram в игровом чате.
  # false — все сообщения из Telegram подписаны словом «Telegram».
  show-telegram-names: true

  # Проверять при старте, не вышла ли новая версия SNTelegram.
  update-check: true


# ─────────────────────────────────────────────────────────────────────────────
#  ПОДКЛЮЧЕНИЕ К TELEGRAM
# ─────────────────────────────────────────────────────────────────────────────
telegram:

  # Токен бота от @BotFather. Выглядит как 123456789:AAH-xxxxxxxxxxxxxxxxx
  # Это пароль от бота: любой, кто его получит, сможет читать всю переписку
  # группы. Плагин никогда не печатает токен ни в лог, ни в сообщения об ошибках.
  token: ''

  # id группы. Отрицательное число, например -1001234567890123.
  chat-id: 0

  # Адрес Bot API. Менять только если поднят свой сервер Bot API
  # (https://core.telegram.org/bots/api#using-a-local-bot-api-server).
  base-url: 'https://api.telegram.org'

  # Сколько секунд держать соединение открытым, ожидая новых сообщений.
  # Больше значение — меньше запросов и меньше нагрузки. Потолок Telegram — 50.
  poll-timeout: 30

  # Выбрасывать сообщения, накопившиеся, пока сервер был выключен.
  # Telegram хранит их до 24 часов. Если это выключить, сервер после ночного
  # простоя вывалит в игровой чат всю ночную переписку разом.
  drop-backlog: true

  # HTTP-прокси, если прямого доступа к api.telegram.org нет.
  # Пустой host — без прокси.
  proxy:
    host: ''
    port: 0


# ─────────────────────────────────────────────────────────────────────────────
#  ТЕМЫ: ЧТО КУДА ИДЁТ
# ─────────────────────────────────────────────────────────────────────────────
#  Каждая тема — это тема форума в группе Telegram. Имя слева придумываешь ты,
#  оно нужно только чтобы отличать темы в /sntelegram status.
#
#    thread-id       номер темы; 0 — это General (главная тема группы)
#    events          что уходит в эту тему из игры
#    from-telegram   true — написанное в этой теме попадёт в игровой чат
#    prefix          пометка перед сообщением в игре
#
#  Доступные события (можно писать по-русски):
#    chat / чат              — сообщения игроков
#    join / вход             — заходы на сервер
#    quit / выход            — выходы
#    death / смерть          — смерти
#    advancement / достижение — достижения
#    server / сервер         — запуск и остановка сервера
#    moderation / модерация  — журнал наказаний
#  Или одно слово all — всё сразу.
#
#  Если тем в группе нет, оставь одну тему с thread-id: 0 — всё пойдёт в общий
#  чат группы, и это нормальная рабочая конфигурация.
# ─────────────────────────────────────────────────────────────────────────────
topics:

  основной:
    thread-id: 0
    events: [chat, join, quit, server]
    from-telegram: true
    prefix: '[TG]'

  админка:
    thread-id: 2
    events: [moderation]
    from-telegram: true
    prefix: '[админ]'

  логи:
    thread-id: 3
    events: [death, advancement]
    from-telegram: false
    prefix: '[лог]'


# ─────────────────────────────────────────────────────────────────────────────
#  МОДЕРАЦИЯ ИЗ TELEGRAM
# ─────────────────────────────────────────────────────────────────────────────
#  Главная возможность плагина. Ответь в Telegram на сообщение игрока и напиши:
#
#      /мут 10м мат в чате       — запретить писать в чат
#      /кик грубость             — отключить от сервера
#      /бан 7д гриферство        — забанить
#      /инфо                     — карточка игрока
#      /размут   /разбан Ник
#
#  Ник указывать не нужно — он берётся из сообщения, на которое ты ответил.
#  Без ответа ник пишется первым: /бан Ник 7д причина
#
#  Команды без цели: /онлайн, /статус, /сказать текст, /помощь
#  Сроки: 10м, 2ч, 7д, навсегда. Английские варианты (10m, 2h, 7d) тоже работают.
#
#  Намеренно НЕ сделано: команды вида /rcon и /console, которые выполняют на
#  сервере что угодно. Их нет и не будет — это прямой путь выдать права всей
#  группе, если у кого-то уведут аккаунт.
# ─────────────────────────────────────────────────────────────────────────────
moderation:

  enabled: true

  # Считать администраторами моста администраторов группы Telegram.
  # Удобно: команда уже существует, второй список вести не нужно.
  # Список обновляется примерно раз в минуту.
  trust-chat-admins: true

  # Дополнительный список Telegram-id, которым разрешена модерация.
  # Их права не зависят от того, что происходит внутри группы.
  # Свой id можно узнать у @userinfobot.
  admins: []


# ─────────────────────────────────────────────────────────────────────────────
#  ОГРАНИЧЕНИЯ ОТПРАВКИ
# ─────────────────────────────────────────────────────────────────────────────
#  Telegram придерживает ботов, которые шлют слишком часто. Значения ниже
#  намеренно чуть меньше его потолков: проиграть полсекунды не жалко, а
#  попасть под ограничение в час пик — значит перестать доставлять сообщения
#  ровно тогда, когда на них кто-то смотрит.
#
#  Менять есть смысл, только если в логе появляются жалобы на переполнение.
# ─────────────────────────────────────────────────────────────────────────────
limits:

  # Сообщений в секунду суммарно.
  per-second: 25

  # Сообщений в минуту в одну группу.
  per-chat-per-minute: 18

  # Сколько сообщений держать в очереди, если Telegram недоступен.
  # При переполнении выбрасываются самые старые: свежий чат нужнее вчерашнего.
  queue-size: 500

  # Сообщение старше этого срока не отправляется вовсе.
  max-age-seconds: 120


# ─────────────────────────────────────────────────────────────────────────────
#  ВНЕШНИЙ ВИД СООБЩЕНИЙ
# ─────────────────────────────────────────────────────────────────────────────
#  ВНИМАНИЕ: здесь два разных языка разметки, и они не взаимозаменяемы.
#
#  Всё, что уходит В TELEGRAM — это HTML Telegram с подстановками в {фигурных}
#  скобках. Поддерживаются теги: b, i, u, s, code, pre, a, blockquote,
#  tg-spoiler. Другие теги Telegram отклонит.
#
#  Единственный шаблон, идущий В ИГРУ — from-telegram — это MiniMessage с
#  подстановками в <угловых> скобках. Фигурные скобки там не работают, и это
#  сделано намеренно: подстановка чужого текста в исходник MiniMessage
#  позволила бы любому участнику группы выдать игрокам кликабельную команду.
# ─────────────────────────────────────────────────────────────────────────────
format:

  chat: '<b>{player}</b>: {message}'
  join: '▸ <b>{player}</b> зашёл на сервер'
  quit: '◂ <b>{player}</b> вышел'
  death: '☠ {message}'
  advancement: '★ <b>{player}</b> получил достижение «{advancement}»'
  server-start: '🟢 Сервер запущен'
  server-stop: '🔴 Сервер остановлен'
  moderation: '⚖ {message}'

  # Этот — MiniMessage, в игру.
  from-telegram: '<gray>[TG]</gray> <white><user></white><gray>:</gray> <message>'
